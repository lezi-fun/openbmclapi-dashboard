# /www/server/panel/vhost/nginx/openbmclapi.conf
# 说明：
# 1) 主业务继续走 127.0.0.1:4000
# 2) 仪表盘服务走 127.0.0.1:4001
# 3) /api/dashboard/stats 单独转发到仪表盘服务
# 4) 通过 geoip2 将国家码写入 access_log 末尾，供 server.js 解析

upstream openbmclapi_app {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream openbmclapi_dashboard {
    server 127.0.0.1:4001;
    keepalive 16;
}

# GeoIP2（请按你机器上的 mmdb 路径修改）
geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
    auto_reload 5m;
    $geoip2_country_code source=$remote_addr country iso_code;
}

log_format openbmclapi_geo '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" "$geoip2_country_code"';

server {
    listen 80;
    listen 443 ssl http2;
    server_name oapi.lezi.chat;

    index index.html index.htm default.htm default.html;

    ssl_certificate      /www/server/panel/vhost/cert/openbmclapi/fullchain.pem;
    ssl_certificate_key  /www/server/panel/vhost/cert/openbmclapi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # HTTP -> HTTPS
    if ($server_port !~ 443) {
        return 301 https://$host$request_uri;
    }

    include /www/server/panel/vhost/rewrite/node_openbmclapi.conf;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md|package.json|package-lock.json|\.env|node_modules) {
        return 404;
    }

    location /.well-known/ {
        root /www/openbmclapi/;
    }

    # 缓存清理（按需保留）
    location ~ /purge(/.*) {
        proxy_cache_purge cache_one $host$request_uri$is_args$args;
    }

    # 仪表盘 API（绝对路径）
    location = /api/dashboard/stats {
        proxy_pass http://openbmclapi_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # 仪表盘静态页面入口： https://oapi.lezi.chat/dashboard/
    location /dashboard/ {
        proxy_pass http://openbmclapi_dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    # 主业务流量
    location / {
        proxy_pass http://openbmclapi_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        add_header X-Cache $upstream_cache_status;

        proxy_connect_timeout 30s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    access_log /www/wwwlogs/openbmclapi.log openbmclapi_geo;
    error_log  /www/wwwlogs/openbmclapi.error.log;
}
